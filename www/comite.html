<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f2f57">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <title>Comité – inscriptions aux compétitions</title>
  <style>
    :root {
      --navy: #17457d; --navy-dark: #0f2f57; --orange: #f2731d;
      --ink: #1c2530; --muted: #6b7684; --border: #dfe3e8; --bg: #f4f6f8; --card: #fff;
      --ok: #2e7d32; --ok-bg: #e3f4e4; --warn: #8a5a00; --warn-bg: #fff3d6; --err: #c62828; --err-bg: #fde3e3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    header { background: var(--navy-dark); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 18px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; }
    header small { display: block; color: #9ec3ee; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
    header button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
    main { max-width: 1250px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .login { max-width: 420px; margin: 40px auto; }
    .login h2 { margin: 0 0 6px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: 15px; }
    .login input { width: 100%; letter-spacing: 2px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--navy); background: #fff; color: var(--navy); text-decoration: none; }
    .btn.primary { background: var(--navy); color: #fff; }
    .btn.orange { background: var(--orange); border-color: var(--orange); color: #fff; }
    .btn:disabled { opacity: .5; cursor: wait; }
    .error { color: var(--err); margin-top: 10px; }
    .hidden { display: none !important; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .toolbar .grow { flex: 1; min-width: 180px; }
    .toolbar .grow input { width: 100%; }
    .seg { display: inline-flex; border: 1px solid var(--navy); border-radius: 7px; overflow: hidden; }
    .seg button { border: 0; background: #fff; color: var(--navy); padding: 8px 12px; font: inherit; cursor: pointer; }
    .seg button.on { background: var(--navy); color: #fff; }
    .clubs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { display: inline-block; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: #eef0f2; }
    .chip.ok { background: var(--ok-bg); color: var(--ok); }
    .chip.warn { background: var(--warn-bg); color: var(--warn); }
    .chip.err { background: var(--err-bg); color: var(--err); }
    .stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .group { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .group > h3 { margin: 0; padding: 10px 14px; background: #e8f1fb; color: var(--navy-dark); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
    .group > h3 span { font-weight: 400; color: var(--muted); font-size: 13px; }
    .group > h3 b.count { margin-left: auto; color: var(--navy); font-size: 13px; }
    .sub { padding: 8px 14px 4px; font-weight: 700; color: var(--navy); border-top: 1px solid var(--border); }
    .sub span { font-weight: 400; color: var(--muted); }
    .tbl { overflow-x: auto; padding: 0 14px 10px; }
    table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13px; table-layout: fixed; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th:nth-child(1) { width: 20%; } th:nth-child(2) { width: 15%; } th:nth-child(3) { width: 10%; } th:nth-child(4) { width: 6%; }
    th:nth-child(5) { width: 12%; } th:nth-child(6) { width: 8%; } th:nth-child(7) { width: 12%; } th:nth-child(8) { width: 17%; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: #eef0f2; }
    .tag.Jeunes { background: #e3f4e4; color: var(--ok); }
    .tag.Adultes { background: #e8f1fb; color: var(--navy); }
    .tag.Stages { background: #fff3d6; color: var(--warn); }
    .empty { text-align: center; color: var(--muted); padding: 30px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <div><small>Espace comité départemental</small><h1 id="title">Inscriptions aux compétitions</h1></div>
    <button id="logoutBtn" class="hidden" onclick="logout()">Déconnexion</button>
  </header>
  <main>
    <div id="loginBox" class="card login">
      <h2>🔒 Accès comité</h2>
      <p style="color:var(--muted);margin:0;">Inscriptions validées par les clubs, classées par compétition et par club.</p>
      <label for="code">Code d'accès du comité</label>
      <input type="password" id="code" autocomplete="current-password" onkeydown="if (event.key === 'Enter') login()">
      <button class="btn primary" style="margin-top:12px;width:100%;justify-content:center;" id="loginBtn" onclick="login()">Se connecter</button>
      <div id="loginError" class="error hidden"></div>
    </div>

    <div id="app" class="hidden">
      <div class="seg" style="margin-bottom:12px;"><button id="mInsc" class="on" onclick="setMode('insc')">📋 Inscriptions</button><button id="mDocs" onclick="setMode('docs')">📄 Documents des compétitions</button></div>
      <div id="docsApp" class="hidden"></div>
      <div id="inscApp">
      <div class="card">
        <div class="toolbar">
          <div class="seg"><button id="vComp" class="on" onclick="setView('comp')">Par compétition</button><button id="vClub" onclick="setView('club')">Par club</button></div>
          <select id="fType" onchange="render()"><option value="">Toutes les compétitions</option><option>Jeunes</option><option>Adultes</option><option>Stages</option><option value="autre">Autres</option></select>
          <select id="fClub" onchange="render()"><option value="">Tous les clubs</option></select>
          <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);"><input type="checkbox" id="fFutur" checked onchange="render()"> Épreuves à venir</label>
          <div class="grow"><input type="search" id="fSearch" placeholder="Rechercher (joueur, compétition, lieu, licence…)" oninput="render()"></div>
        </div>
        <div class="toolbar" style="margin-top:10px;">
          <button class="btn orange" onclick="downloadXlsx(this)">⬇ Tout télécharger (.xlsx)</button>
          <select id="fComp"></select>
          <button class="btn" onclick="if ($('fComp').value) downloadComp($('fComp').value)">⬇ Classeur de la compétition</button>
          <a class="btn hidden" id="sheetLink" target="_blank" rel="noopener">📄 Google Sheet du comité ↗</a>
          <button class="btn" onclick="loadAll()">↻ Actualiser</button>
        </div>
        <div class="clubs" id="clubStatus"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div id="list"></div>
      </div>
    </div>
  </main>
  <footer>RebonTT · espace comité (accès réservé)</footer>

<script src="clubs.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // ---------------------------------------------------------------------------
  // Espace comité départemental : interroge le script de chaque club de
  // l'annuaire (config.js › CLUBS) avec le code comité, et rassemble les
  // inscriptions validées. Le code n'est gardé que le temps de la session.
  // ---------------------------------------------------------------------------
  var CFG = window.APP_CONFIG || {};
  // Clubs d'essai : seulement avec ?essai=1 (et s'ils ont leur propre script).
  var AVEC_ESSAI = /[?&]essai=1/.test(location.search);
  var CLUBS = (CFG.CLUBS && CFG.CLUBS.length ? CFG.CLUBS : [{ id: 'club', nom: 'Club' }]).filter(function (c) {
    return !c.essai || (AVEC_ESSAI && c.serverUrl);
  }).map(function (c) {
    return { id: c.id, nom: c.nom + (c.essai ? ' (essai)' : ''), ville: c.ville || '', url: c.serverUrl || CFG.SERVER_URL };
  });
  var COMITE = CFG.COMITE || {};
  var DATA = [], STATUS = {}, VIEW = 'comp', CODE = '', COMPS = {}, DOCS = null;

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function dateKey(d) { var m = String(d || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + m[2] + m[1] : '99999999'; }
  function today() { var d = new Date(); return '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }
  function compKey(r) { return r.type + '|' + r.competition; }
  // Ordre des compétitions (type, puis nom) et des tableaux (Coupe de Rouen :
  // -1700, -1300, -900, puis sans tableau).
  var TYPE_ORDER = ['Jeunes', 'Adultes', 'Tous', 'Stages'];
  function typeRank(r) { var i = TYPE_ORDER.indexOf(r.type); return i < 0 ? 9 : i; }
  function tabRank(r) { var n = Number(String(r.tableau || '').replace(/[^0-9]/g, '')); return n ? -n : 1; }
  function compLabel(r) { return r.competition + (r.epreuve ? ' – ' + r.epreuve : ''); }

  if (COMITE.nom) { $('title').textContent = 'Inscriptions aux compétitions – ' + COMITE.nom; document.title = COMITE.nom + ' – inscriptions'; }
  if (COMITE.sheetUrl) { $('sheetLink').href = COMITE.sheetUrl; $('sheetLink').classList.remove('hidden'); }

  function call(url, fn, args) {
    return fetch(url, { method: 'POST', mode: 'cors', credentials: 'omit', cache: 'no-store', body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (p) { if (!p || !p.ok) throw new Error((p && p.error) || 'Réponse invalide'); return p.result; });
  }

  function login() {
    var code = $('code').value.trim();
    if (!code) return;
    CODE = code;
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'Connexion…';
    loadAll().then(function (okCount) {
      $('loginBtn').disabled = false; $('loginBtn').textContent = 'Se connecter';
      if (!okCount) {
        var msgs = Object.keys(STATUS).map(function (k) { return STATUS[k].error; }).filter(Boolean);
        $('loginError').textContent = msgs[0] || 'Accès refusé.';
        $('loginError').classList.remove('hidden');
        CODE = '';
        return;
      }
      try { sessionStorage.setItem('rebontt_comite', code); } catch (e) { /* navigation privée */ }
      $('loginBox').classList.add('hidden'); $('app').classList.remove('hidden'); $('logoutBtn').classList.remove('hidden');
      $('code').value = '';
    });
  }
  function logout() {
    CODE = ''; DATA = [];
    try { sessionStorage.removeItem('rebontt_comite'); } catch (e) { /* rien */ }
    $('app').classList.add('hidden'); $('logoutBtn').classList.add('hidden'); $('loginBox').classList.remove('hidden'); $('loginError').classList.add('hidden');
  }

  // Tous les clubs en parallèle ; un club en erreur n'empêche pas les autres.
  function loadAll() {
    $('clubStatus').innerHTML = CLUBS.map(function (c) { return '<span class="chip">⏳ ' + esc(c.nom) + '</span>'; }).join('');
    return Promise.all(CLUBS.map(function (c) {
      return call(c.url, 'getComiteExport', [CODE]).then(function (res) {
        var nom = (res.club && res.club.nom) || c.nom;
        STATUS[c.id] = { nom: nom, n: res.inscriptions.length, at: res.generatedAt, version: (res.club && res.club.version) || '' };
        (res.competitions || []).forEach(function (k) { COMPS[k.type + '|' + k.nom] = k; });
        return res.inscriptions.map(function (r) { r.club = nom; return r; });
      }).catch(function (e) {
        STATUS[c.id] = { nom: c.nom, error: e.message };
        return [];
      });
    })).then(function (lists) {
      DATA = [].concat.apply([], lists);
      var clubs = CLUBS.map(function (c) { return STATUS[c.id].nom; });
      $('fClub').innerHTML = '<option value="">Tous les clubs</option>' + clubs.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
      $('clubStatus').innerHTML = CLUBS.map(function (c) {
        var s = STATUS[c.id];
        return s.error ? '<span class="chip ' + (/non configuré/.test(s.error) ? 'warn' : 'err') + '" title="' + esc(s.error) + '">⚠ ' + esc(s.nom) + ' : ' + esc(s.error) + '</span>'
          : '<span class="chip ok" title="Version du script du club : ' + esc(s.version || 'ancienne') + '">✓ ' + esc(s.nom) + ' : ' + s.n + ' inscription' + (s.n > 1 ? 's' : '') + '</span>';
      }).join('');
      render();
      return CLUBS.filter(function (c) { return !STATUS[c.id].error; }).length;
    });
  }

  function filtered() {
    var t = $('fType').value, club = $('fClub').value, fut = $('fFutur').checked, q = $('fSearch').value.toLowerCase().trim(), now = today();
    return DATA.filter(function (r) {
      if (t === 'autre' ? ['Jeunes', 'Adultes', 'Stages'].indexOf(r.type) >= 0 : (t && r.type !== t)) return false;
      if (club && r.club !== club) return false;
      if (fut && dateKey(r.date) < now) return false;
      if (q && [r.competition, r.epreuve, r.lieu, r.club, r.nom, r.prenom, r.licence, r.categorie].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      return VIEW === 'club'
        ? a.club.localeCompare(b.club) || dateKey(a.date).localeCompare(dateKey(b.date)) || compLabel(a).localeCompare(compLabel(b)) || a.nom.localeCompare(b.nom)
        : typeRank(a) - typeRank(b) || a.competition.localeCompare(b.competition) || dateKey(a.date).localeCompare(dateKey(b.date)) ||
          String(a.epreuve).localeCompare(String(b.epreuve)) || tabRank(a) - tabRank(b) || a.club.localeCompare(b.club) || a.nom.localeCompare(b.nom) || a.prenom.localeCompare(b.prenom);
    });
  }
  function setView(v) { VIEW = v; $('vComp').classList.toggle('on', v === 'comp'); $('vClub').classList.toggle('on', v === 'club'); render(); }

  function playersTable(rows) {
    var tab = rows.some(function (r) { return r.tableau; });
    return '<div class="tbl"><table><tr><th>Nom</th><th>Prénom</th><th>Catégorie</th><th>' + (tab ? 'Tableau' : 'Sexe') + '</th><th>Licence</th><th>Points</th><th>Équipe</th><th>Participation</th></tr>' +
      rows.map(function (r) {
        return '<tr><td><b>' + esc(r.nom) + '</b></td><td>' + esc(r.prenom) + '</td><td>' + esc(r.categorie) + '</td><td>' + esc(tab ? r.tableau : r.sexe) + '</td><td>' + esc(r.licence) + '</td><td>' + esc(r.points) + '</td><td>' + esc(r.equipe) + '</td><td>' + esc(r.participation || '—') + '</td></tr>';
      }).join('') + '</table></div>';
  }
  // Inscrits d'un tour : par tableau (s'il y en a) puis par club.
  function tourBody(rows) {
    var byClub = function (list) {
      return groupBy(list, function (r) { return r.club; }).map(function (c) {
        return '<div class="sub" style="padding-left:28px;">' + esc(c.key) + ' <span>(' + c.rows.length + ')</span></div>' + playersTable(c.rows);
      }).join('');
    };
    if (!rows.some(function (r) { return r.tableau; })) return byClub(rows);
    return groupBy(rows, function (r) { return r.tableau || 'Sans tableau'; }).map(function (t) {
      return '<div class="sub" style="padding-left:20px;color:var(--orange);">Tableau ' + esc(t.key) + ' <span>(' + t.rows.length + ')</span></div>' + byClub(t.rows);
    }).join('');
  }
  function groupBy(rows, keyFn) {
    var out = [], idx = {};
    rows.forEach(function (r) { var k = keyFn(r); if (!(k in idx)) { idx[k] = out.length; out.push({ key: k, rows: [] }); } out[idx[k]].rows.push(r); });
    return out;
  }
  function render() {
    var rows = filtered();
    var keys = groupBy(rows.slice().sort(function (a, b) { return compKey(a).localeCompare(compKey(b)); }), compKey);
    var cur = $('fComp').value;
    $('fComp').innerHTML = '<option value="">Choisir une compétition…</option>' + keys.map(function (g) {
      return '<option value="' + esc(g.key) + '"' + (g.key === cur ? ' selected' : '') + '>' + esc(g.rows[0].competition + ' (' + g.rows[0].type + ')') + ' – ' + g.rows.length + '</option>';
    }).join('');
    var comps = groupBy(rows, function (r) { return r.date + '|' + compLabel(r); });
    $('stats').textContent = rows.length + ' inscription' + (rows.length > 1 ? 's' : '') + ' · ' + comps.length + ' épreuve' + (comps.length > 1 ? 's' : '') +
      ' · ' + groupBy(rows, function (r) { return r.club; }).length + ' club(s)';
    if (!rows.length) { $('list').innerHTML = '<div class="card empty">Aucune inscription validée pour ces critères.</div>'; return; }
    var html;
    if (VIEW === 'comp') {
      // Par compétition, puis par tour (date), puis par tableau et par club.
      html = groupBy(rows, compKey).map(function (g) {
        var r0 = g.rows[0], tours = groupBy(g.rows, function (r) { return r.date + '|' + r.epreuve; });
        return '<div class="group"><h3><span class="tag ' + esc(r0.type) + '">' + esc(r0.type) + '</span>' + esc(r0.competition) +
          '<span>' + tours.length + ' tour' + (tours.length > 1 ? 's' : '') + '</span><b class="count">' + g.rows.length + ' inscription' + (g.rows.length > 1 ? 's' : '') + '</b>' +
          '<button class="btn" style="padding:3px 8px;font-size:12px;" title="Classeur de la compétition : tous les inscrits + un onglet par club" onclick="downloadComp(\'' + esc(compKey(r0)).replace(/'/g, '\\\'') + '\')">⬇ Classeur</button></h3>' +
          // Tours repliables : le premier (prochain) ouvert.
          tours.map(function (t, k) {
            var t0 = t.rows[0];
            return '<details class="tour"' + (k === 0 ? ' open' : '') + '><summary class="sub" style="background:#f6f8fb;cursor:pointer;">📅 ' + esc(t0.epreuve || t0.competition) + ' <span>· ' + esc(t0.date) + (t0.lieu ? ' · ' + esc(t0.lieu) : '') + ' · ' + t.rows.length + ' inscrit' + (t.rows.length > 1 ? 's' : '') + '</span></summary>' + tourBody(t.rows) + '</details>';
          }).join('') + '</div>';
      }).join('');
    } else {
      html = groupBy(rows, function (r) { return r.club; }).map(function (c) {
        return '<div class="group"><h3>' + esc(c.key) + '<b class="count">' + c.rows.length + ' inscription' + (c.rows.length > 1 ? 's' : '') + '</b></h3>' +
          groupBy(c.rows, function (r) { return r.date + '|' + compLabel(r); }).map(function (g) {
            var r0 = g.rows[0];
            return '<div class="sub"><span class="tag ' + esc(r0.type) + '">' + esc(r0.type) + '</span> ' + esc(compLabel(r0)) + ' <span>· ' + esc(r0.date) + (r0.lieu ? ' · ' + esc(r0.lieu) : '') + ' (' + g.rows.length + ')</span></div>' + playersTable(g.rows);
          }).join('') + '</div>';
      }).join('');
    }
    $('list').innerHTML = html;
  }

  // Classeur d'UNE compétition (toutes ses épreuves, selon les filtres
  // affichés) : onglet « Tous les inscrits » puis un onglet par club.
  function sheetName(n, used) {
    var base = String(n || 'Club').replace(/[\[\]*?:\/\\]/g, ' ').trim().slice(0, 31) || 'Club', x = base, k = 2;
    while (used[x.toLowerCase()]) { var suf = ' (' + (k++) + ')'; x = base.slice(0, 31 - suf.length) + suf; }
    used[x.toLowerCase()] = true;
    return x;
  }
  function downloadComp(key) {
    if (!window.XLSX) { alert('Bibliothèque Excel indisponible (connexion ?).'); return; }
    var rows = filtered().filter(function (r) { return compKey(r) === key; }).sort(function (a, b) {
      return dateKey(a.date).localeCompare(dateKey(b.date)) || tabRank(a) - tabRank(b) || a.club.localeCompare(b.club) || a.nom.localeCompare(b.nom) || a.prenom.localeCompare(b.prenom);
    });
    if (!rows.length) { alert('Aucun inscrit pour cette compétition avec les filtres actuels.'); return; }
    var cols = ['Date', 'Épreuve', 'Tableau', 'Lieu', 'Club', 'Nom', 'Prénom', 'Catégorie', 'Sexe', 'Licence', 'Points', 'Équipe', 'Participation'];
    var line = function (r) { return [r.date, r.epreuve, r.tableau || '', r.lieu, r.club, r.nom, r.prenom, r.categorie, r.sexe, r.licence, r.points, r.equipe, r.participation]; };
    var wb = XLSX.utils.book_new(), used = {};
    var add = function (name, aoa, widths) {
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = widths.map(function (w) { return { wch: w }; });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 0), c: aoa[0].length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, ws, sheetName(name, used));
    };
    add('Tous les inscrits', [cols].concat(rows.map(line)), [11, 22, 9, 22, 26, 18, 14, 10, 6, 11, 7, 8, 13]);
    groupBy(rows.slice().sort(function (a, b) { return a.club.localeCompare(b.club); }), function (r) { return r.club; }).forEach(function (g) {
      var c2 = cols.filter(function (c) { return c !== 'Club'; });
      add(g.key, [c2].concat(g.rows.map(function (r) { var l = line(r); return l.slice(0, 4).concat(l.slice(5)); })), [11, 22, 9, 22, 18, 14, 10, 6, 11, 7, 8, 13]);
    });
    var r0 = rows[0];
    XLSX.writeFile(wb, ('inscriptions-' + r0.competition + '-' + r0.type).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/-+$/, '') + '.xlsx');
  }

  // Classeur : « Par compétition », « Par club » et « Résumé » (nombre
  // d'inscrits par épreuve et par club), selon les filtres affichés.
  function downloadXlsx(btn) {
    if (!window.XLSX) { alert('Bibliothèque Excel indisponible (connexion ?).'); return; }
    var view = VIEW, cols = ['Date', 'Type', 'Compétition', 'Épreuve', 'Lieu', 'Club', 'Nom', 'Prénom', 'Catégorie', 'Sexe', 'Licence', 'Points', 'Équipe', 'Participation', 'Tableau'];
    var line = function (r) { return [r.date, r.type, r.competition, r.epreuve, r.lieu, r.club, r.nom, r.prenom, r.categorie, r.sexe, r.licence, r.points, r.equipe, r.participation, r.tableau || '']; };
    VIEW = 'comp'; var byComp = filtered(); VIEW = 'club'; var byClub = filtered(); VIEW = view;
    var wb = XLSX.utils.book_new();
    var add = function (name, aoa, widths) {
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = widths.map(function (w) { return { wch: w }; });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 0), c: aoa[0].length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    var W = [11, 9, 26, 22, 22, 26, 18, 14, 10, 6, 11, 7, 8, 13, 9];
    add('Par compétition', [cols].concat(byComp.map(line)), W);
    var clubCols = ['Club', 'Date', 'Type', 'Compétition', 'Épreuve', 'Lieu', 'Nom', 'Prénom', 'Catégorie', 'Sexe', 'Licence', 'Points', 'Équipe', 'Participation', 'Tableau'];
    add('Par club', [clubCols].concat(byClub.map(function (r) { var l = line(r); return [l[5]].concat(l.slice(0, 5), l.slice(6)); })), [26, 11, 9, 26, 22, 22, 18, 14, 10, 6, 11, 7, 8, 13, 9]);
    var clubs = groupBy(byComp, function (r) { return r.club; }).map(function (g) { return g.key; }).sort();
    var summary = [['Date', 'Type', 'Épreuve'].concat(clubs, ['Total'])];
    groupBy(byComp, function (r) { return r.date + '|' + compLabel(r); }).forEach(function (g) {
      var r0 = g.rows[0];
      summary.push([r0.date, r0.type, compLabel(r0)].concat(clubs.map(function (c) { return g.rows.filter(function (r) { return r.club === c; }).length; }), [g.rows.length]));
    });
    add('Résumé', summary, [11, 9, 34].concat(clubs.map(function () { return 14; }), [8]));
    var d = new Date();
    XLSX.writeFile(wb, 'inscriptions-' + (COMITE.nom || 'comite').replace(/\W+/g, '') + '-' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.xlsx');
  }

  // ---------------------------------------------------------------------------
  // Documents des compétitions : règlement, description et lien du site du
  // comité, enregistrés par le script du comité (Comite.gs déployé en
  // Application Web, adresse dans config.js › COMITE.apiUrl) et affichés dans
  // l'appli des clubs (joueurs et administrateurs).
  // ---------------------------------------------------------------------------
  var PUBLICS = ['Jeunes', 'Adultes', 'Stages', 'Tous'];
  function setMode(m) {
    $('mInsc').classList.toggle('on', m === 'insc'); $('mDocs').classList.toggle('on', m === 'docs');
    $('inscApp').classList.toggle('hidden', m !== 'insc'); $('docsApp').classList.toggle('hidden', m !== 'docs');
    if (m === 'docs') loadDocs();
  }
  function loadDocs() {
    var box = $('docsApp');
    if (!COMITE.apiUrl) {
      box.innerHTML = '<div class="card"><h2 style="margin-top:0;">Documents des compétitions</h2><p>Pour publier les documents, le script du comité (<code>backend/Comite.gs</code>) doit être déployé en <b>Application Web</b> ' +
        '(Déployer › Nouveau déploiement › Application Web, exécuter en tant que moi, accès : tout le monde), puis son adresse /exec ajoutée dans <code>config.js › COMITE.apiUrl</code>.</p></div>';
      return;
    }
    box.innerHTML = '<div class="card">Chargement des documents…</div>';
    call(COMITE.apiUrl, 'getDocuments', []).then(function (docs) { DOCS = docs; renderDocs(); })
      .catch(function (e) { box.innerHTML = '<div class="card error">Documents indisponibles : ' + esc(e.message) + '</div>'; });
  }
  function docKey(d) { return d.public + '|' + d.competition; }
  function renderDocs() {
    var byKey = {};
    (DOCS || []).forEach(function (d) { byKey[docKey(d)] = d; });
    // Compétitions des clubs (type = public) + fiches déjà enregistrées.
    var keys = Object.keys(COMPS).map(function (k) { var c = COMPS[k]; return (PUBLICS.indexOf(c.type) >= 0 ? c.type : 'Tous') + '|' + c.nom; });
    Object.keys(byKey).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    keys = keys.filter(function (k, i) { return keys.indexOf(k) === i; }).sort(function (a, b) {
      var pa = a.split('|'), pb = b.split('|');
      return PUBLICS.indexOf(pa[0]) - PUBLICS.indexOf(pb[0]) || pa[1].localeCompare(pb[1]);
    });
    $('docsApp').innerHTML = '<div class="card"><h2 style="margin-top:0;">Documents des compétitions</h2>' +
      '<p style="color:var(--muted);margin-top:-4px;">Règlement, présentation et lien vers la page du comité : affichés aux joueurs et aux administrateurs des clubs, sur chaque compétition individuelle.</p>' +
      '<div class="toolbar"><input id="newComp" placeholder="Autre compétition (nom exact, ex. Critérium Fédéral)" style="flex:1;min-width:220px;"><select id="newPub">' + PUBLICS.map(function (p) { return '<option>' + p + '</option>'; }).join('') + '</select>' +
      '<button class="btn" onclick="addDoc()">+ Ajouter</button></div></div>' +
      keys.map(function (k, i) {
        var p = k.split('|'), d = byKey[k] || { competition: p.slice(1).join('|'), public: p[0], description: '', reglement: '', site: '' };
        return '<div class="group"><h3><span class="tag ' + esc(d.public) + '">' + esc(d.public) + '</span>' + esc(d.competition) +
          '<span>' + (byKey[k] ? 'mis à jour le ' + esc(d.majLe || '') : 'pas encore de fiche') + '</span></h3><div style="padding:10px 14px;">' +
          '<label>Présentation de la compétition</label><textarea id="dDesc' + i + '" rows="3" style="width:100%;font:inherit;padding:8px;border:1px solid var(--border);border-radius:6px;">' + esc(d.description) + '</textarea>' +
          '<label>Règlement (lien ou fichier PDF)</label><div class="toolbar"><input id="dReg' + i + '" value="' + esc(d.reglement) + '" placeholder="https://…" style="flex:1;min-width:220px;">' +
          '<input type="file" id="dFile' + i + '" accept="application/pdf,image/*" style="max-width:230px;"><button class="btn" onclick="uploadDoc(' + i + ', this)">⬆ Envoyer le fichier</button></div>' +
          '<label>Page de la compétition sur le site du comité</label><input id="dSite' + i + '" value="' + esc(d.site) + '" placeholder="https://…" style="width:100%;">' +
          '<div class="toolbar" style="margin-top:10px;"><button class="btn primary" onclick="saveDoc(' + i + ', this)">Enregistrer</button>' +
          (byKey[k] ? '<button class="btn" onclick="deleteDoc(' + i + ')">Supprimer la fiche</button>' : '') +
          (d.reglement ? '<a class="btn" href="' + esc(d.reglement) + '" target="_blank" rel="noopener">Voir le règlement ↗</a>' : '') +
          '<span id="dSt' + i + '" style="font-size:13px;"></span></div></div></div>';
      }).join('');
    $('docsApp').dataset.keys = JSON.stringify(keys);
  }
  function keyAt(i) { return JSON.parse($('docsApp').dataset.keys)[i].split('|'); }
  function addDoc() {
    var nom = $('newComp').value.trim(); if (!nom) return;
    COMPS[$('newPub').value + '|' + nom] = { type: $('newPub').value, nom: nom };
    renderDocs();
  }
  function saveDoc(i, btn) {
    var k = keyAt(i);
    btn.disabled = true; $('dSt' + i).textContent = 'Enregistrement…';
    call(COMITE.apiUrl, 'saveDocument', [CODE, { competition: k.slice(1).join('|'), public: k[0], description: $('dDesc' + i).value, reglement: $('dReg' + i).value.trim(), site: $('dSite' + i).value.trim() }])
      .then(function (docs) { DOCS = docs; renderDocs(); })
      .catch(function (e) { btn.disabled = false; $('dSt' + i).textContent = '⚠ ' + e.message; });
  }
  function deleteDoc(i) {
    var k = keyAt(i);
    if (!confirm('Supprimer la fiche « ' + k.slice(1).join('|') + ' » ?')) return;
    call(COMITE.apiUrl, 'deleteDocument', [CODE, k.slice(1).join('|'), k[0]]).then(function (docs) { DOCS = docs; renderDocs(); })
      .catch(function (e) { alert(e.message); });
  }
  function uploadDoc(i, btn) {
    var f = $('dFile' + i).files[0];
    if (!f) { alert('Choisissez un fichier.'); return; }
    if (f.size > 10 * 1024 * 1024) { alert('Fichier trop volumineux (10 Mo maximum).'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      btn.disabled = true; $('dSt' + i).textContent = 'Envoi du fichier…';
      call(COMITE.apiUrl, 'uploadDocument', [CODE, f.name, f.type, fr.result]).then(function (r) {
        btn.disabled = false; $('dReg' + i).value = r.url; $('dSt' + i).textContent = '✓ Fichier envoyé : pensez à Enregistrer.';
      }).catch(function (e) { btn.disabled = false; $('dSt' + i).textContent = '⚠ ' + e.message; });
    };
    fr.readAsDataURL(f);
  }

  // Reconnexion automatique dans le même onglet.
  (function () {
    var saved = null;
    try { saved = sessionStorage.getItem('rebontt_comite'); } catch (e) { saved = null; }
    if (saved) { $('code').value = saved; login(); }
  })();
</script>
</body>
</html>
