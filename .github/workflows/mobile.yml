name: Applications mobiles

on:
  push:
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi l'application iOS (simulateur, sans signature)"
        type: boolean
        default: false

jobs:
  android:
    name: Android (APK de test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Notifications push : si le secret GOOGLE_SERVICES_JSON (fichier
      # google-services.json du projet Firebase) est défini dans le dépôt,
      # l'APK est compilé avec Firebase et l'appli active les notifications
      # push. Sans ce secret, seuls les rappels locaux fonctionnent.
      - name: Configuration Firebase (notifications push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo 'window.APP_CONFIG.PUSH_ENABLED = true;' >> www/config.js
            echo "Firebase configuré : notifications push activées."
          else
            echo "Secret GOOGLE_SERVICES_JSON absent : notifications push désactivées (rappels locaux seulement)."
          fi
      - run: npx cap sync android
      - name: Compilation
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: brulages-fri-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulateur)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilation
        working-directory: ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
